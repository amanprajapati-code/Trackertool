<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TICICTRACKER — Your Academic Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* ---- Design tokens : "TICICTRACKER" — liquid glass over deep water ---- */
  --abyss:#060a14;
  --deep-tide:#0d1730;
  --deep-tide-2:#0a1226;
  --glass:rgba(255,255,255,0.06);
  --glass-strong:rgba(255,255,255,0.10);
  --glass-border:rgba(255,255,255,0.14);
  --signal:#4da3ff;
  --signal-soft:#8fc4ff;
  --foam:#5fe1c0;
  --coral:#ff6b6b;
  --amber:#ffc85c;
  --text-1:#f5f7fa;
  --text-2:#9aa7bd;
  --text-3:#5f6b80;
  --radius-lg:26px;
  --radius-md:18px;
  --radius-sm:12px;
  --display:'Outfit', 'Inter', sans-serif;
  --body:'Inter', sans-serif;
  --mono:'JetBrains Mono', monospace;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--body);
  font-weight:400;
  color:var(--text-1);
  background:var(--abyss);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
p, span, div, li, label{ font-weight:400; }

/* ---------- ambient liquid background ---------- */
.tide-bg{
  position:fixed; inset:0; z-index:0; overflow:hidden;
  background:
    radial-gradient(1200px 800px at 15% -10%, #123058 0%, transparent 60%),
    radial-gradient(1000px 700px at 110% 10%, #0f2a4a 0%, transparent 55%),
    linear-gradient(180deg, var(--abyss) 0%, var(--deep-tide-2) 55%, var(--abyss) 100%);
}
.blob{
  position:absolute; border-radius:50%;
  filter:blur(70px); opacity:0.5;
  animation:drift 22s ease-in-out infinite alternate;
}
.blob.b1{width:520px;height:520px; background:radial-gradient(circle,#1a4d7a,transparent 70%); top:-10%; left:-10%;}
.blob.b2{width:460px;height:460px; background:radial-gradient(circle,#0d3d3a,transparent 70%); bottom:-15%; right:-5%; animation-delay:-9s;}
.blob.b3{width:380px;height:380px; background:radial-gradient(circle,#132a52,transparent 70%); top:40%; left:60%; animation-delay:-15s;}
@keyframes drift{
  0%{ transform:translate(0,0) scale(1); }
  100%{ transform:translate(40px,-30px) scale(1.08); }
}
@media (prefers-reduced-motion: reduce){
  .blob{animation:none;}
}

/* ---------- layout shell ---------- */
#app{position:relative; z-index:1; min-height:100vh;}
.screen{display:none; min-height:100vh;}
.screen.active{display:block;}

.center-stage{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:24px;
}

/* ---------- glass card ---------- */
.glass{
  background:var(--glass);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-lg);
  backdrop-filter:blur(24px) saturate(140%);
  -webkit-backdrop-filter:blur(24px) saturate(140%);
  box-shadow:0 8px 32px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.06);
}
.glass-sm{
  background:var(--glass);
  border:1px solid var(--glass-border);
  border-radius:var(--radius-md);
  backdrop-filter:blur(18px) saturate(140%);
  -webkit-backdrop-filter:blur(18px) saturate(140%);
}

/* ---------- typography ---------- */
h1,h2,h3{font-family:var(--display); letter-spacing:-0.01em; font-weight:700; line-height:1.15;}
.eyebrow{
  font-family:var(--mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
  color:var(--signal-soft); opacity:0.9; font-weight:600;
}
.text-2{color:var(--text-2);}
.text-3{color:var(--text-3);}
.mono{font-family:var(--mono);}

/* ---------- buttons & inputs ---------- */
.btn{
  font-family:var(--body); font-weight:600; font-size:14.5px;
  padding:13px 22px; border-radius:14px; border:none; cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
}
.btn:active{transform:scale(0.97);}
.btn-primary{
  background:linear-gradient(135deg, var(--signal), #2f7dd6);
  color:#04121f;
  box-shadow:0 6px 20px rgba(77,163,255,0.35);
}
.btn-primary:hover{box-shadow:0 8px 26px rgba(77,163,255,0.5);}
.btn-ghost{
  background:var(--glass-strong); color:var(--text-1); border:1px solid var(--glass-border);
}
.btn-ghost:hover{background:rgba(255,255,255,0.14);}
.btn-danger{ background:rgba(255,107,107,0.15); color:var(--coral); border:1px solid rgba(255,107,107,0.3);}
.btn-block{width:100%;}
.btn-sm{padding:9px 14px; font-size:13px; border-radius:11px;}
.btn:disabled{opacity:0.45; cursor:not-allowed;}

input[type=text],input[type=email],input[type=password],input[type=date],input[type=time],select,textarea{
  width:100%; background:rgba(255,255,255,0.05); border:1px solid var(--glass-border);
  color:var(--text-1); padding:13px 15px; border-radius:12px; font-family:var(--body);
  font-size:14.5px; outline:none; transition:border-color .15s ease, background .15s ease;
}
input::placeholder, textarea::placeholder{color:var(--text-3);}
input:focus, select:focus, textarea:focus{border-color:var(--signal); background:rgba(255,255,255,0.08);}
label{font-size:12.5px; color:var(--text-2); font-weight:600; margin-bottom:6px; display:block; letter-spacing:0.01em;}
.field{margin-bottom:16px;}

::selection{background:rgba(77,163,255,0.35);}

/* ---------- scrollbar ---------- */
::-webkit-scrollbar{width:6px; height:6px;}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.15); border-radius:10px;}

/* ---------- utility ---------- */
.hidden{display:none !important;}
.row{display:flex; align-items:center;}
.between{justify-content:space-between;}
.gap-8{gap:8px;} .gap-12{gap:12px;} .gap-16{gap:16px;}
.fade-in{animation:fadeIn .5s ease both;}
@keyframes fadeIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
.toast-wrap{position:fixed; top:20px; left:50%; transform:translateX(-50%); z-index:999; display:flex; flex-direction:column; gap:8px; align-items:center;}
.toast{
  padding:12px 20px; border-radius:14px; font-size:13.5px; font-weight:600;
  animation:toastIn .3s ease both;
}
@keyframes toastIn{from{opacity:0; transform:translateY(-14px);} to{opacity:1; transform:translateY(0);}}

/* ---------- liquid attendance ring ---------- */
.ring{
  position:relative; width:150px; height:150px; border-radius:50%;
  overflow:hidden; flex-shrink:0;
  border:1px solid var(--glass-border);
  background:rgba(255,255,255,0.03);
  box-shadow:inset 0 0 24px rgba(0,0,0,0.35);
}
.ring .water{
  position:absolute; bottom:0; left:0; width:100%;
  transition:height 1.3s cubic-bezier(.4,0,.2,1);
  opacity:0.85;
}
.ring .wave{
  position:absolute; top:-14px; left:50%; width:220%; height:34px;
  border-radius:44%;
  animation:spin 7s linear infinite;
  opacity:0.9; transform-origin:center;
}
.ring .wave2{
  width:240%; height:30px; top:-11px;
  animation:spin 5s linear infinite reverse;
  opacity:0.45;
}
@keyframes spin{
  from{ transform:translate(-50%,0) rotate(0deg); }
  to{ transform:translate(-50%,0) rotate(360deg); }
}
.ring-label{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; z-index:2;
  text-shadow:0 2px 10px rgba(0,0,0,0.5);
}

/* ---------- per-subject liquid bar ---------- */
.liquid-bar{
  height:9px; border-radius:20px; background:rgba(255,255,255,0.06);
  overflow:hidden; position:relative;
}
.liquid-bar-fill{
  height:100%; border-radius:20px; transition:width 1.1s cubic-bezier(.4,0,.2,1);
  background-size:200% 100%;
  animation:shimmer 3s linear infinite;
}
@keyframes shimmer{
  0%{filter:brightness(1);} 50%{filter:brightness(1.18);} 100%{filter:brightness(1);}
}

/* ---------- time picker (hour / minute / am-pm dropdowns) ---------- */
.time-picker{
  display:flex; align-items:center; gap:6px;
  background:rgba(255,255,255,0.05); border:1px solid var(--glass-border);
  border-radius:12px; padding:4px 8px;
}
.time-picker select{
  background:transparent; border:none; color:var(--text-1); font-family:var(--mono);
  font-size:14.5px; padding:9px 4px; outline:none; flex:1; min-width:0;
}
.time-picker select:focus{background:rgba(255,255,255,0.06); border-radius:8px;}
.time-picker option{background:#0d1730; color:var(--text-1);}

/* ---------- modal ---------- */
.modal-overlay{
  position:fixed; inset:0; z-index:100; background:rgba(3,6,12,0.6);
  backdrop-filter:blur(6px);
  display:flex; align-items:center; justify-content:center; padding:20px;
  animation:fadeIn .25s ease both;
}
</style>
</head>
<body>

<div class="tide-bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<div class="toast-wrap" id="toastWrap"></div>
<div id="app"></div>

<script type="module" src="./app.js"></script>
</body>
</html>
